# ===== Service Identity =====
spring.application.name=announcement-service
server.port=${PORT:8092}

# ===== Security =====
# Set to true to disable authentication (for local testing only!)
security.test-mode=${SECURITY_TEST_MODE:true}

# ===== Database (PostgreSQL) =====
# Render auto-creates the database; Hibernate auto-creates tables via ddl-auto=update
# For local dev: use tokendb (shared) or create announcement_db manually
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/announcement_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===== OAuth2 Resource Server (JWT validation) =====
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8080/oauth2/jwks}

# ===== External Service URLs =====
bse.api.base-url=${BSE_API_BASE_URL:https://api.bseindia.com/BseIndiaAPI/api}
portfolio.api.base-url=${PORTFOLIO_API_BASE_URL:http://localhost:8082/portfolio-service}
reporting.api.base-url=${REPORTING_API_BASE_URL:http://localhost:8082/reporting-service}

# ===== CORS =====
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8082,https://stockanalytics-hv70.onrender.com}

# ===== Announcement Sync Settings =====
announcement.sync.enabled=${ANNOUNCEMENT_SYNC_ENABLED:true}
announcement.sync.timezone=Asia/Kolkata
# Every 5 minutes, all days
announcement.sync.cron=0 0/5 * * * *
# Daily catch-up at 7 PM
announcement.sync.daily-cron=0 0 19 * * *
# Monday morning catch-up at 8:30 AM
announcement.sync.weekend-cron=0 30 8 * * MON

# ===== Resilience4j Circuit Breaker (bseApi) =====
resilience4j.circuitbreaker.instances.bseApi.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.bseApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.bseApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.bseApi.slowCallRateThreshold=50
resilience4j.circuitbreaker.instances.bseApi.slowCallDurationThreshold=5s
resilience4j.circuitbreaker.instances.bseApi.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.bseApi.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.bseApi.permittedNumberOfCallsInHalfOpenState=3

# ===== Resilience4j Retry (bseApi) =====
resilience4j.retry.instances.bseApi.maxAttempts=3
resilience4j.retry.instances.bseApi.waitDuration=2s
resilience4j.retry.instances.bseApi.enableExponentialBackoff=true
resilience4j.retry.instances.bseApi.exponentialBackoffMultiplier=2.0

# ===== Resilience4j Circuit Breaker (portfolioApi) =====
resilience4j.circuitbreaker.instances.portfolioApi.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.portfolioApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.portfolioApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.portfolioApi.waitDurationInOpenState=10s

# ===== Resilience4j Retry (portfolioApi) =====
resilience4j.retry.instances.portfolioApi.maxAttempts=3
resilience4j.retry.instances.portfolioApi.waitDuration=1s

# ===== Resilience4j Circuit Breaker (reportingApi) =====
resilience4j.circuitbreaker.instances.reportingApi.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.reportingApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.reportingApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.reportingApi.waitDurationInOpenState=10s

# ===== Caching =====
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

# ===== Actuator / Monitoring =====
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=announcement-service
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=b3

# ===== AI/OpenAI Configuration =====
ai.enabled=${AI_ENABLED:true}
ai.openai.api-base=${AI_OPENAI_API_BASE:https://api.openai.com/v1}
ai.openai.api-key=${OPENAI_API_KEY}

ai.openai.model=${AI_OPENAI_MODEL:gpt-4o-mini}

# ===== Gemini Configuration (for concall summaries) =====
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

# ===== WebClient SSL Configuration =====
# Set to false in production for proper certificate validation
webclient.ssl.insecure=${WEBCLIENT_SSL_INSECURE:true}

# ===== RabbitMQ =====
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Results event queue settings
results.rabbitmq.exchange=results.exchange
results.rabbitmq.queue=results.fetch.queue
results.rabbitmq.routing-key=results.fetch

# ===== Logging =====
logging.level.com.example.announcement_service=INFO
logging.level.io.github.resilience4j=DEBUG
logging.level.org.springframework.web.reactive.function.client=DEBUG
