#------------------ Profile ------------------
# SPRING_PROFILES_ACTIVE=render is supplied via env

#------------------ Security ------------------
# IMPORTANT: Disable test mode in production!
security.test-mode=false

#------------------ Database ------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

#------------------ JWT Validation ------------------
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI}

#------------------ External Services ------------------
bse.api.base-url=${BSE_API_BASE_URL:https://api.bseindia.com/BseIndiaAPI/api}
portfolio.api.base-url=${PORTFOLIO_API_BASE_URL}
reporting.api.base-url=${REPORTING_API_BASE_URL}

#------------------ CORS ------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://stockanalytics-hv70.onrender.com}

#------------------ Announcement Sync ------------------
announcement.sync.enabled=${ANNOUNCEMENT_SYNC_ENABLED:true}
announcement.sync.timezone=Asia/Kolkata

#------------------ Logging ------------------
logging.level.com.example.announcement_service=INFO
logging.level.io.github.resilience4j=INFO
