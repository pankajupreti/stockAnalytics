# Docker profile for OAuth service
frontend.base-url=http://localhost:9082

# JWT issuer must match what gateway expects
oauth.issuer=http://oauth-service:8080

# Eureka - use container name
eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka

# Google OAuth redirect for Docker
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:9082/oauth-service/login/oauth2/code/google
