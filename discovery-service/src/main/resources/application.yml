server:
  port: ${PORT:8761}

spring:
  application:
    name: discovery-service

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

# Optional: Expose health for Render health checks
management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics"
  metrics:
    tags:
      application: discovery-service
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3