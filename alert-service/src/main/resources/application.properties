# ===== Service Identity =====
spring.application.name=alert-service
server.port=${PORT:8087}

# ===== Security =====
security.test-mode=${SECURITY_TEST_MODE:true}

# ===== Database (PostgreSQL) =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alert_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===== OAuth2 Resource Server (JWT validation) =====
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8080/oauth2/jwks}

# ===== External Service URLs =====
# Reporting service - via gateway for authenticated user requests
reporting.api.base-url=${REPORTING_API_BASE_URL:http://localhost:8082/reporting-service}
# Reporting service - direct for internal/scheduled calls (bypasses gateway, no JWT needed)
reporting.api.internal-url=${REPORTING_API_INTERNAL_URL:http://localhost:8083}
# Portfolio service for user positions
portfolio.api.base-url=${PORTFOLIO_API_BASE_URL:http://localhost:8082/portfolio-service}

# ===== CORS =====
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8082,https://stockanalytics-hv70.onrender.com}

# ===== Alert Monitoring Settings =====
alert.monitor.enabled=${ALERT_MONITOR_ENABLED:true}
alert.monitor.interval-ms=60000
# Default stop-loss percentage (5%)
alert.default.stop-loss-percent=5.0

# ===== Email Configuration (Gmail SMTP) =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
alert.email.from=${ALERT_EMAIL_FROM:noreply@stockanalytics.com}
alert.email.enabled=${ALERT_EMAIL_ENABLED:true}

# ===== WhatsApp/Telegram Configuration =====
# Twilio WhatsApp (free sandbox for testing)
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.whatsapp-from=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
alert.whatsapp.enabled=${ALERT_WHATSAPP_ENABLED:false}

# Telegram Bot (free alternative)
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
alert.telegram.enabled=${ALERT_TELEGRAM_ENABLED:false}

# ===== Resilience4j Circuit Breaker =====
resilience4j.circuitbreaker.instances.reportingClient.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.reportingClient.slidingWindowSize=10
resilience4j.circuitbreaker.instances.reportingClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.reportingClient.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.reportingClient.permittedNumberOfCallsInHalfOpenState=3

resilience4j.retry.instances.reportingClient.maxAttempts=3
resilience4j.retry.instances.reportingClient.waitDuration=2s

# ===== Caching =====
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=60s

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=alert-service
management.tracing.sampling.probability=1.0
management.tracing.propagation.type=b3

# ===== Logging =====
logging.level.com.example.alert_service=INFO
logging.level.io.github.resilience4j=DEBUG
