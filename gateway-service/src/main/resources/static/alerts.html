<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Alerts</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="./assets/images/logo-icon.png" />
    <style>
        :root { --bg:#0f172a; --card:#ffffff; --muted:#6b7280; --soft:#eef2ff; --border:#e5e7eb; --primary:#2563eb; }
        body{ margin:0; font-family:Segoe UI, Arial, sans-serif; background:#f9fafb; color:#111827; }
        .navbar{ background:var(--bg); color:#fff; display:flex; align-items:center; justify-content:space-between; padding:12px 18px; position:sticky; top:0; z-index:100; }
        .brand{ font-weight:700; letter-spacing:.3px; }
        .links a{ color:#cbd5e1; text-decoration:none; padding:8px 10px; border-radius:8px; margin-left:8px; }
        .links a.active, .links a:hover{ color:#fff; background:rgba(255,255,255,.1); }
        .wrap{ padding:20px; max-width:1200px; margin:0 auto; }

        .header-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
        .back-link { color:var(--primary); text-decoration:none; font-weight:600; }
        .back-link:hover { text-decoration:underline; }

        /* Tabs */
        .tabs { display:flex; gap:0; margin-bottom:20px; border-bottom:2px solid var(--border); }
        .tab-btn {
            padding:14px 28px;
            background:none;
            border:none;
            cursor:pointer;
            font-size:15px;
            font-weight:600;
            color:var(--muted);
            border-bottom:3px solid transparent;
            margin-bottom:-2px;
            transition: all 0.2s;
        }
        .tab-btn:hover { color:var(--primary); }
        .tab-btn.active { color:var(--primary); border-bottom-color:var(--primary); }
        .tab-count {
            display:inline-block;
            background:#e5e7eb;
            color:#374151;
            font-size:12px;
            padding:2px 8px;
            border-radius:10px;
            margin-left:8px;
        }
        .tab-btn.active .tab-count { background:var(--primary); color:white; }
        .tab-content { display:none; }
        .tab-content.active { display:block; }

        /* Stats cards */
        .stats { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; margin-bottom:20px; }
        .stat-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; }
        .stat-card .label { font-size:12px; color:var(--muted); margin-bottom:6px; }
        .stat-card .value { font-size:24px; font-weight:700; }
        .stat-card.active .value { color:#2563eb; }
        .stat-card.triggered .value { color:#dc2626; }
        .stat-card.cancelled .value { color:#6b7280; }
        .stat-card.total .value { color:#111827; }

        /* Alert cards */
        .alert-card {
            background:var(--card);
            border:1px solid var(--border);
            border-radius:12px;
            padding:16px 20px;
            margin-bottom:12px;
            box-shadow:0 1px 3px rgba(0,0,0,.05);
            display:flex;
            align-items:center;
            gap:16px;
        }
        .alert-card:hover { box-shadow:0 2px 8px rgba(0,0,0,.1); }
        .alert-card.triggered { border-left:4px solid #ef4444; background:#fef2f2; }
        .alert-card.active { border-left:4px solid #2563eb; }
        .alert-card.cancelled { border-left:4px solid #9ca3af; opacity:0.7; }
        .alert-card.expired { border-left:4px solid #f59e0b; opacity:0.7; }
        .alert-card.unseen { background:#fef3c7; }

        .alert-icon {
            font-size:28px;
            width:50px;
            height:50px;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:12px;
            flex-shrink:0;
        }
        .alert-icon.active { background:#dbeafe; }
        .alert-icon.triggered { background:#fee2e2; }
        .alert-icon.cancelled { background:#f3f4f6; }
        .alert-icon.expired { background:#fef3c7; }

        .alert-main { flex:1; min-width:0; }
        .alert-header { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
        .alert-ticker {
            font-weight:700;
            font-size:16px;
            color:#111827;
        }
        .alert-company {
            font-size:13px;
            color:var(--muted);
        }
        .alert-type-badge {
            display:inline-block;
            padding:3px 10px;
            border-radius:6px;
            font-size:11px;
            font-weight:600;
        }
        .badge-stop-loss { background:#fee2e2; color:#991b1b; }
        .badge-price-above { background:#dcfce7; color:#166534; }
        .badge-price-below { background:#fef3c7; color:#92400e; }
        .badge-pct-above { background:#dbeafe; color:#1e40af; }
        .badge-pct-below { background:#fce7f3; color:#9d174d; }

        .alert-details {
            display:flex;
            gap:20px;
            font-size:13px;
            color:var(--muted);
            flex-wrap:wrap;
        }
        .alert-detail { display:flex; align-items:center; gap:4px; }
        .alert-detail strong { color:#374151; }

        .alert-status-badge {
            display:inline-block;
            padding:4px 12px;
            border-radius:20px;
            font-size:12px;
            font-weight:600;
        }
        .status-active { background:#dbeafe; color:#1e40af; }
        .status-triggered { background:#fee2e2; color:#991b1b; }
        .status-cancelled { background:#f3f4f6; color:#6b7280; }
        .status-expired { background:#fef3c7; color:#92400e; }

        .alert-actions {
            display:flex;
            gap:8px;
            flex-shrink:0;
        }

        .btn { padding:8px 14px; border:none; border-radius:8px; cursor:pointer; font-weight:600; font-size:13px; }
        .btn-primary { background:var(--primary); color:white; }
        .btn-primary:hover { background:#1d4ed8; }
        .btn-outline { background:#fff; border:1px solid var(--border); color:#374151; }
        .btn-outline:hover { background:#f9fafb; }
        .btn-danger { background:#ef4444; color:white; }
        .btn-danger:hover { background:#dc2626; }
        .btn-sm { padding:6px 10px; font-size:12px; }
        .btn-success { background:#10b981; color:white; }
        .btn-success:hover { background:#059669; }

        .empty { text-align:center; padding:60px 20px; color:var(--muted); }
        .empty-icon { font-size:48px; margin-bottom:12px; }
        .loading { text-align:center; padding:60px 20px; color:var(--muted); }

        .triggered-time {
            font-size:12px;
            color:#dc2626;
            margin-top:4px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .alert-card { flex-direction:column; align-items:flex-start; }
            .alert-actions { width:100%; justify-content:flex-end; margin-top:12px; }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="brand">Stock Analytics</div>
    <div class="links">
        <a href="dashboard.html">Dashboard</a>
        <a href="52w-breakouts.html">52W Breakouts</a>
        <a href="marketbreadth.html">Market Breadth</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="portfolio-analytics.html">Analytics</a>
        <a href="pnl-report.html">P&L Report</a>
        <a href="alerts.html" class="active">Alerts</a>
        <a href="announcements.html">Announcements</a>
        <a href="results-analysis.html">Results</a>
        <a href="good-results.html">Good Results</a>
        <a href="pead-scanner.html">PEAD</a>
        <a href="health.html" class="admin-only">Health</a>
    </div>
</div>

<div class="wrap">
    <div class="header-row">
        <div>
            <a href="portfolio.html" class="back-link">&larr; Back to Portfolio</a>
            <h2 style="margin:8px 0">Price Alerts</h2>
        </div>
        <button class="btn btn-primary" onclick="window.location.href='portfolio.html'">+ Create Alert from Portfolio</button>
    </div>

    <!-- Stats -->
    <div class="stats" id="stats">
        <div class="stat-card active">
            <div class="label">Active Alerts</div>
            <div class="value" id="stat-active">-</div>
        </div>
        <div class="stat-card triggered">
            <div class="label">Triggered</div>
            <div class="value" id="stat-triggered">-</div>
        </div>
        <div class="stat-card cancelled">
            <div class="label">Cancelled/Expired</div>
            <div class="value" id="stat-cancelled">-</div>
        </div>
        <div class="stat-card total">
            <div class="label">Total Alerts</div>
            <div class="value" id="stat-total">-</div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="active">
            Active <span class="tab-count" id="count-active">0</span>
        </button>
        <button class="tab-btn" data-tab="triggered">
            Triggered <span class="tab-count" id="count-triggered">0</span>
        </button>
        <button class="tab-btn" data-tab="history">
            History <span class="tab-count" id="count-history">0</span>
        </button>
    </div>

    <!-- Active Alerts Tab -->
    <div id="tab-active" class="tab-content active">
        <div id="active-alerts" class="alerts-list">
            <div class="loading">Loading alerts...</div>
        </div>
    </div>

    <!-- Triggered Alerts Tab -->
    <div id="tab-triggered" class="tab-content">
        <div id="triggered-alerts" class="alerts-list">
            <div class="loading">Loading alerts...</div>
        </div>
    </div>

    <!-- History Tab -->
    <div id="tab-history" class="tab-content">
        <div id="history-alerts" class="alerts-list">
            <div class="loading">Loading alerts...</div>
        </div>
    </div>
</div>

<script src="token-utils.js"></script>
<script>
const tokenKey = "access_token";
// Use authenticated endpoints via gateway
const ALERT_API_BASE = window.location.hostname === "localhost"
    ? "http://localhost:8082/alert-service/api/alerts"
    : `${window.location.origin}/alert-service/api/alerts`;

let allAlerts = [];

function getToken() {
    return localStorage.getItem(tokenKey);
}

function authHeaders() {
    const token = getToken();
    return token ? { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' } : {};
}

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
    });
});

function formatDate(dateStr) {
    if (!dateStr) return '-';
    const d = new Date(dateStr);
    return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function formatPrice(price) {
    if (price === null || price === undefined) return '-';
    return '₹' + Number(price).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function getAlertTypeLabel(type) {
    const labels = {
        'STOP_LOSS': 'Stop Loss',
        'PRICE_ABOVE': 'Price Above',
        'PRICE_BELOW': 'Price Below',
        'PCT_ABOVE': '% Above',
        'PCT_BELOW': '% Below'
    };
    return labels[type] || type;
}

function getAlertTypeBadgeClass(type) {
    const classes = {
        'STOP_LOSS': 'badge-stop-loss',
        'PRICE_ABOVE': 'badge-price-above',
        'PRICE_BELOW': 'badge-price-below',
        'PCT_ABOVE': 'badge-pct-above',
        'PCT_BELOW': 'badge-pct-below'
    };
    return classes[type] || '';
}

function getStatusBadgeClass(status) {
    const classes = {
        'ACTIVE': 'status-active',
        'TRIGGERED': 'status-triggered',
        'CANCELLED': 'status-cancelled',
        'EXPIRED': 'status-expired'
    };
    return classes[status] || '';
}

function getAlertIcon(status) {
    const icons = {
        'ACTIVE': '🔔',
        'TRIGGERED': '🚨',
        'CANCELLED': '🚫',
        'EXPIRED': '⏰'
    };
    return icons[status] || '🔔';
}

function renderAlertCard(alert) {
    const statusClass = alert.status.toLowerCase();
    const unseenClass = alert.status === 'TRIGGERED' && !alert.seen ? 'unseen' : '';

    let targetDisplay = '';
    if (alert.alertType === 'STOP_LOSS') {
        targetDisplay = `Stop at ${formatPrice(alert.targetPrice)} (${alert.stopLossPercent || 5}% below buy)`;
    } else if (alert.alertType === 'PRICE_ABOVE' || alert.alertType === 'PRICE_BELOW') {
        targetDisplay = `Target: ${formatPrice(alert.targetPrice)}`;
    } else {
        targetDisplay = `Target: ${alert.targetPrice}%`;
    }

    let triggeredInfo = '';
    if (alert.status === 'TRIGGERED' && alert.triggeredAt) {
        triggeredInfo = `
            <div class="triggered-time">
                Triggered at ${formatPrice(alert.triggeredPrice)} on ${formatDate(alert.triggeredAt)}
            </div>
        `;
    }

    let actions = '';
    if (alert.status === 'ACTIVE') {
        actions = `
            <button class="btn btn-outline btn-sm" onclick="cancelAlert(${alert.id})">Cancel</button>
            <button class="btn btn-danger btn-sm" onclick="deleteAlert(${alert.id})">Delete</button>
        `;
    } else if (alert.status === 'TRIGGERED' && !alert.seen) {
        actions = `
            <button class="btn btn-success btn-sm" onclick="markAsSeen(${alert.id})">Mark Read</button>
            <button class="btn btn-danger btn-sm" onclick="deleteAlert(${alert.id})">Delete</button>
        `;
    } else {
        actions = `
            <button class="btn btn-danger btn-sm" onclick="deleteAlert(${alert.id})">Delete</button>
        `;
    }

    return `
        <div class="alert-card ${statusClass} ${unseenClass}">
            <div class="alert-icon ${statusClass}">
                ${getAlertIcon(alert.status)}
            </div>
            <div class="alert-main">
                <div class="alert-header">
                    <span class="alert-ticker">${alert.ticker}</span>
                    <span class="alert-company">${alert.companyName || ''}</span>
                    <span class="alert-type-badge ${getAlertTypeBadgeClass(alert.alertType)}">
                        ${getAlertTypeLabel(alert.alertType)}
                    </span>
                </div>
                <div class="alert-details">
                    <div class="alert-detail">
                        <span>${targetDisplay}</span>
                    </div>
                    <div class="alert-detail">
                        <span>Buy Price:</span>
                        <strong>${formatPrice(alert.buyPrice)}</strong>
                    </div>
                    ${alert.currentPrice ? `
                        <div class="alert-detail">
                            <span>Current:</span>
                            <strong>${formatPrice(alert.currentPrice)}</strong>
                        </div>
                    ` : ''}
                    <div class="alert-detail">
                        <span>Created:</span>
                        <strong>${formatDate(alert.createdAt)}</strong>
                    </div>
                </div>
                ${triggeredInfo}
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
                <span class="alert-status-badge ${getStatusBadgeClass(alert.status)}">${alert.status}</span>
                <div class="alert-actions">
                    ${actions}
                </div>
            </div>
        </div>
    `;
}

function renderAlerts() {
    const activeAlerts = allAlerts.filter(a => a.status === 'ACTIVE');
    const triggeredAlerts = allAlerts.filter(a => a.status === 'TRIGGERED');
    const historyAlerts = allAlerts.filter(a => a.status === 'CANCELLED' || a.status === 'EXPIRED');

    // Update counts
    document.getElementById('count-active').textContent = activeAlerts.length;
    document.getElementById('count-triggered').textContent = triggeredAlerts.length;
    document.getElementById('count-history').textContent = historyAlerts.length;

    // Update stats
    document.getElementById('stat-active').textContent = activeAlerts.length;
    document.getElementById('stat-triggered').textContent = triggeredAlerts.length;
    document.getElementById('stat-cancelled').textContent = historyAlerts.length;
    document.getElementById('stat-total').textContent = allAlerts.length;

    // Render active alerts
    const activeContainer = document.getElementById('active-alerts');
    if (activeAlerts.length === 0) {
        activeContainer.innerHTML = `
            <div class="empty">
                <div class="empty-icon">🔔</div>
                <p>No active alerts</p>
                <p style="font-size:13px;">Create alerts from your portfolio to get notified when prices hit your targets.</p>
            </div>
        `;
    } else {
        activeContainer.innerHTML = activeAlerts.map(renderAlertCard).join('');
    }

    // Render triggered alerts
    const triggeredContainer = document.getElementById('triggered-alerts');
    const unseenCount = triggeredAlerts.filter(a => !a.seen).length;
    if (triggeredAlerts.length === 0) {
        triggeredContainer.innerHTML = `
            <div class="empty">
                <div class="empty-icon">🚨</div>
                <p>No triggered alerts</p>
                <p style="font-size:13px;">Alerts will appear here when they are triggered.</p>
            </div>
        `;
    } else {
        // Sort by triggered date, most recent first
        triggeredAlerts.sort((a, b) => new Date(b.triggeredAt) - new Date(a.triggeredAt));
        let headerHtml = '';
        if (unseenCount > 0) {
            headerHtml = `
                <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
                    <button class="btn btn-success" onclick="markAllTriggeredSeen()">Mark All Read (${unseenCount})</button>
                </div>
            `;
        }
        triggeredContainer.innerHTML = headerHtml + triggeredAlerts.map(renderAlertCard).join('');
    }

    // Render history
    const historyContainer = document.getElementById('history-alerts');
    if (historyAlerts.length === 0) {
        historyContainer.innerHTML = `
            <div class="empty">
                <div class="empty-icon">📋</div>
                <p>No alert history</p>
                <p style="font-size:13px;">Cancelled and expired alerts will appear here.</p>
            </div>
        `;
    } else {
        historyContainer.innerHTML = historyAlerts.map(renderAlertCard).join('');
    }
}

async function loadAlerts() {
    try {
        // Use fetchWithAuth for automatic token refresh on 401
        const res = await fetchWithAuth(ALERT_API_BASE);

        if (!res.ok) {
            throw new Error('Failed to load alerts');
        }

        allAlerts = await res.json();
        renderAlerts();

    } catch (e) {
        console.error('Error loading alerts:', e);
        document.getElementById('active-alerts').innerHTML = `
            <div class="empty">
                <div class="empty-icon">⚠️</div>
                <p>Error loading alerts</p>
                <p style="font-size:13px;">${e.message}</p>
            </div>
        `;
    }
}

async function cancelAlert(id) {
    if (!confirm('Are you sure you want to cancel this alert?')) return;

    try {
        const res = await fetchWithAuth(`${ALERT_API_BASE}/${id}/cancel`, {
            method: 'POST'
        });

        if (res.ok) {
            loadAlerts();
        } else {
            alert('Failed to cancel alert');
        }
    } catch (e) {
        console.error('Error cancelling alert:', e);
        alert('Error cancelling alert');
    }
}

async function deleteAlert(id) {
    if (!confirm('Are you sure you want to delete this alert permanently?')) return;

    try {
        const res = await fetchWithAuth(`${ALERT_API_BASE}/${id}`, {
            method: 'DELETE'
        });

        if (res.ok) {
            loadAlerts();
        } else {
            alert('Failed to delete alert');
        }
    } catch (e) {
        console.error('Error deleting alert:', e);
        alert('Error deleting alert');
    }
}

async function markAsSeen(id) {
    try {
        // Use /seen endpoint with alertIds array
        const res = await fetchWithAuth(`${ALERT_API_BASE}/seen`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ alertIds: [id] })
        });

        if (res.ok) {
            // Update local state
            const alert = allAlerts.find(a => a.id === id);
            if (alert) {
                alert.seen = true;
                renderAlerts();
            }
        } else {
            console.error('Failed to mark alert as seen');
        }
    } catch (e) {
        console.error('Error marking alert as seen:', e);
    }
}

async function markAllTriggeredSeen() {
    const triggeredAlerts = allAlerts.filter(a => a.status === 'TRIGGERED' && !a.seen);
    if (triggeredAlerts.length === 0) return;

    try {
        const alertIds = triggeredAlerts.map(a => a.id);
        const res = await fetchWithAuth(`${ALERT_API_BASE}/seen`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ alertIds })
        });

        if (res.ok) {
            triggeredAlerts.forEach(a => a.seen = true);
            renderAlerts();
        }
    } catch (e) {
        console.error('Error marking all alerts as seen:', e);
    }
}

// Initialize
(function init() {
    const token = getToken();
    if (!token) {
        window.location.href = 'index.html';
        return;
    }
    loadAlerts();
})();
</script>
</body>
</html>
